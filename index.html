<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NeoComplex · Badass 🔥</title>
  <!-- Font & Ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,700;14..32,900&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #03050b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      position: relative;
    }

    /* === BACKGROUND HITAM === */
    .bg-black {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #03050b;
    }

    /* === CANVAS OBJEK BERGERAK (RAMAI) === */
    #motion-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* === KONTEN UTAMA === */
    .hero {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 1100px;
      width: 100%;
    }

    /* === CREDIT "MAHESA" BADASS (HANYA INI) === */
    .credit {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 20;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.08);
      text-shadow: 0 0 40px rgba(0, 150, 255, 0.1);
      pointer-events: none;
      font-family: 'Inter', sans-serif;
    }
    .credit span {
      background: rgba(0, 10, 30, 0.2);
      padding: 0.3rem 2.5rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      display: inline-block;
    }

    /* Badge dengan gaya lebih berani */
    .badge {
      background: rgba(0, 20, 50, 0.15);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 180, 255, 0.08);
      padding: 0.7rem 2.2rem;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(180, 210, 255, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      box-shadow: 0 0 60px rgba(0, 80, 255, 0.03);
      animation: badgePulse 3s infinite ease-in-out;
    }
    .badge .live-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #00ff88;
      border-radius: 50%;
      margin-right: 4px;
      animation: blink 1s infinite;
      box-shadow: 0 0 30px #00ff88;
    }
    @keyframes badgePulse {
      0% { box-shadow: 0 0 10px rgba(0, 150, 255, 0.02); }
      50% { box-shadow: 0 0 60px rgba(0, 150, 255, 0.08); }
      100% { box-shadow: 0 0 10px rgba(0, 150, 255, 0.02); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.6); }
    }

    /* Judul badass */
    h1 {
      font-size: clamp(4rem, 16vw, 8.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(135deg, #f0faff 0%, #60b0ff 40%, #a78bfa 80%, #f472b6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 100px rgba(0, 100, 255, 0.05);
      margin-bottom: 0.3rem;
      animation: titleGlow 4s infinite alternate;
    }
    @keyframes titleGlow {
      0% { text-shadow: 0 0 40px rgba(0, 100, 255, 0.02); }
      100% { text-shadow: 0 0 120px rgba(120, 80, 255, 0.1); }
    }

    .sub-title {
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      font-weight: 700;
      color: rgba(180, 210, 255, 0.3);
      max-width: 700px;
      margin: 0.5rem auto 2.5rem;
      letter-spacing: 2px;
      padding: 0.5rem 2rem;
      border-radius: 60px;
      background: rgba(0, 10, 30, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
      text-transform: uppercase;
    }
    .sub-title i {
      color: #60c8ff;
      opacity: 0.5;
    }

    /* === TOMBOL BADASS === */
    .action-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 2rem 3rem;
      margin: 0.5rem 0 1.5rem;
      width: 100%;
    }

    .btn-primary {
      position: relative;
      background: linear-gradient(145deg, #0088ff, #4f46e5);
      border: none;
      padding: 1.2rem 3.5rem;
      border-radius: 80px;
      font-weight: 900;
      font-size: 1.2rem;
      color: #fff;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 1.2rem;
      box-shadow: 0 8px 50px rgba(0, 80, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      overflow: hidden;
      z-index: 1;
      text-transform: uppercase;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 80px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent, rgba(255,255,255,0.05));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .btn-primary i {
      font-size: 1.3rem;
      transition: transform 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 15px 60px rgba(0, 80, 255, 0.35);
      background: linear-gradient(145deg, #1a9aff, #6366f1);
    }
    .btn-primary:hover i {
      transform: translateX(6px) rotate(-10deg) scale(1.1);
    }
    .btn-primary:active {
      transform: scale(0.95) translateY(0);
    }

    /* Tombol Kirim Surat — lebih berani */
    .btn-dev {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 1rem 2.5rem;
      border-radius: 80px;
      font-weight: 700;
      font-size: 1.1rem;
      color: rgba(180, 210, 255, 0.5);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.4s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .btn-dev:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(0, 180, 255, 0.15);
      color: #fff;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 40px rgba(0, 80, 255, 0.06);
    }
    .btn-dev i {
      color: #60c8ff;
      opacity: 0.6;
      transition: all 0.3s ease;
      font-size: 1.2rem;
    }
    .btn-dev:hover i {
      opacity: 1;
      transform: rotate(-10deg) scale(1.1);
    }

    /* === STATISTIK BADASS === */
    .stats {
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat-item {
      text-align: center;
      backdrop-filter: blur(8px);
      background: rgba(0, 15, 35, 0.08);
      padding: 0.6rem 2rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.015);
      transition: all 0.3s ease;
    }
    .stat-item:hover {
      border-color: rgba(0, 180, 255, 0.06);
      background: rgba(0, 20, 50, 0.1);
    }
    .stat-item .number {
      font-size: 2.4rem;
      font-weight: 900;
      background: linear-gradient(to right, #80c8ff, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
    }
    .stat-item .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: rgba(160, 190, 255, 0.25);
      margin-top: 0.1rem;
      font-weight: 700;
    }

    /* === KARTU BADASS === */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 2.5rem 0 1.5rem;
      width: 100%;
    }
    .card {
      background: rgba(5, 15, 35, 0.12);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 180, 255, 0.03);
      border-radius: 28px;
      padding: 1.8rem 1.5rem;
      min-width: 140px;
      flex: 1 0 auto;
      max-width: 190px;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      text-align: center;
      animation: cardFloat 7s infinite alternate ease-in-out;
      transform-origin: center;
      cursor: default;
    }
    .card:nth-child(2) { animation-delay: -1.8s; }
    .card:nth-child(3) { animation-delay: -3.6s; }
    .card:nth-child(4) { animation-delay: -5.4s; }
    @keyframes cardFloat {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-14px) scale(1.02); }
    }
    .card:hover {
      border-color: rgba(0, 200, 255, 0.1);
      box-shadow: 0 0 80px rgba(0, 150, 255, 0.03);
      transform: scale(1.05) translateY(-8px);
      background: rgba(10, 30, 60, 0.12);
    }
    .card i {
      font-size: 2.8rem;
      margin-bottom: 0.6rem;
      color: #70c8ff;
      text-shadow: 0 0 40px rgba(0, 80, 255, 0.05);
      transition: all 0.3s ease;
      opacity: 0.7;
    }
    .card:hover i {
      transform: scale(1.15);
      color: #a0dcff;
      opacity: 1;
    }
    .card h4 {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.2px;
      color: rgba(220, 240, 255, 0.6);
      margin-bottom: 0.1rem;
      text-transform: uppercase;
    }
    .card p {
      font-size: 0.7rem;
      color: rgba(160, 190, 255, 0.25);
      letter-spacing: 1px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* === LIVE BAR BADASS === */
    .live-bar {
      margin-top: 1.8rem;
      width: 100%;
      max-width: 650px;
      background: rgba(0, 10, 30, 0.08);
      backdrop-filter: blur(16px);
      padding: 0.8rem 2rem;
      border-radius: 80px;
      border: 1px solid rgba(0, 200, 255, 0.02);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      font-size: 0.9rem;
      color: rgba(180, 210, 255, 0.3);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .live-bar .live-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ff3366;
      border-radius: 50%;
      margin-right: 10px;
      animation: blinkRed 0.8s infinite;
      box-shadow: 0 0 30px #ff3366;
    }
    @keyframes blinkRed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.5); }
    }
    .live-bar span i {
      margin: 0 6px;
      color: #60c8ff;
      opacity: 0.4;
    }
    .live-bar .badge-people {
      background: rgba(255, 50, 100, 0.04);
      padding: 0.2rem 1.5rem;
      border-radius: 40px;
      border-left: 2px solid rgba(255, 50, 100, 0.08);
      font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .hero { padding: 1.2rem; }
      .credit { font-size: 0.7rem; letter-spacing: 5px; top: 12px; }
      .credit span { padding: 0.2rem 1.5rem; }
      .action-area { gap: 1rem; }
      .btn-primary { padding: 0.8rem 2rem; font-size: 1rem; }
      .btn-dev { padding: 0.7rem 1.8rem; font-size: 0.9rem; }
      .stats { gap: 0.8rem; }
      .stat-item .number { font-size: 1.6rem; }
      .card-grid { gap: 0.8rem; }
      .card { min-width: 100px; padding: 1rem 0.8rem; }
      .card i { font-size: 2rem; }
      .live-bar { flex-direction: column; align-items: center; text-align: center; padding: 0.8rem 1rem; font-size: 0.75rem; }
      .badge { font-size: 0.6rem; padding: 0.4rem 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND HITAM -->
  <div class="bg-black"></div>

  <!-- CANVAS OBJEK BERGERAK (RAMAI) -->
  <canvas id="motion-canvas"></canvas>

  <!-- CREDIT BADASS: HANYA TULISAN "MAHESA" DI ATAS -->
  <div class="credit"><span>⚡ MAHESA ⚡</span></div>

  <!-- KONTEN UTAMA -->
  <section class="hero">
    <div class="badge">
      <span class="live-indicator"></span> LIVE · NEO COMPLEX <i class="fas fa-bolt" style="color: #ffcc00; opacity: 0.4;"></i> 2026
    </div>

    <h1>FUTURISTIK<br>HUB</h1>
    <div class="sub-title">
      <i class="fas fa-skull"></i> by : MAHESA · 24/7 <i class="fas fa-fire"></i>
    </div>

    <div class="action-area">
      <button class="btn-primary" id="exploreBtn">
        <i class="fas fa-rocket"></i> Jelajahi
      </button>
      <button class="btn-dev" id="devBtn">
        <i class="fas fa-envelope"></i> Kirim Surat
      </button>
      <div class="stats">
        <div class="stat-item">
          <div class="number" id="peopleCount">2.4K</div>
          <div class="label"><i class="fas fa-user"></i> online</div>
        </div>
        <div class="stat-item">
          <div class="number" id="eventCount">18</div>
          <div class="label"><i class="fas fa-calendar"></i> event</div>
        </div>
      </div>
    </div>

    <div class="card-grid">
      <div class="card">
        <i class="fas fa-vr-cardboard"></i>
        <h4>tampilan web rapi</h4>
        <p>keren abiz </p>
      </div>
      <div class="card">
        <i class="fas fa-microchip"></i>
        <h4>New Core</h4>
        <p>generatif · realtime</p>
      </div>
      <div class="card">
        <i class="fas fa-robot"></i>
        <h4>Robotik</h4>
        <p>interaksi cerdas</p>
      </div>
      <div class="card">
        <i class="fas fa-cloud-moon"></i>
        <h4>Neo Space</h4>
        <p>metaverse</p>
      </div>
    </div>

    <div class="live-bar">
      <div>
        <span class="live-dot"></span> 
        <span><i class="fas fa-signal"></i> 3.2k aktif</span>
      </div>
      <div class="badge-people">
        <i class="fas fa-comment-dots"></i> 1.2k chatting
      </div>
      <div>
        <i class="fas fa-user-plus"></i> +86 baru
      </div>
    </div>
  </section>

  <script>
    (function() {
      // ============================================================
      // 1. OBJEK BERGERAK (LEBIH RAMAI)
      // ============================================================
      const canvas = document.getElementById('motion-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      const objects = [];
      const types = ['circle', 'ring', 'diamond', 'triangle', 'cross', 'star'];

      // Star shape
      function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = -Math.PI / 2;
        const step = Math.PI / spikes;
        ctx.beginPath();
        for (let i = 0; i < spikes * 2; i++) {
          const r = i % 2 === 0 ? outerRadius : innerRadius;
          const x = cx + Math.cos(rot) * r;
          const y = cy + Math.sin(rot) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          rot += step;
        }
        ctx.closePath();
      }

      class MotionObject {
        constructor() {
          this.type = types[Math.floor(Math.random() * types.length)];
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 20 + 10;
          this.vx = (Math.random() - 0.5) * 1.4;
          this.vy = (Math.random() - 0.5) * 1.4;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.04;
          this.hue = Math.random() * 360;
          this.saturation = 70 + Math.random() * 30;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.15 + Math.random() * 0.25;
          this.glowSize = this.size * 2.5 + Math.random() * 30;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.rotation += this.rotationSpeed;
          if (this.x < -this.size) this.x = width + this.size;
          if (this.x > width + this.size) this.x = -this.size;
          if (this.y < -this.size) this.y = height + this.size;
          if (this.y > height + this.size) this.y = -this.size;
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = this.opacity;

          const color = `hsl(${this.hue}, ${this.saturation}%, ${this.lightness}%)`;
          
          // Glow lebih terang
          const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, this.glowSize);
          grad.addColorStop(0, `hsla(${this.hue}, 100%, 80%, 0.06)`);
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, this.glowSize, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineWidth = 1.2;

          const half = this.size / 2;

          switch (this.type) {
            case 'circle':
              ctx.beginPath();
              ctx.arc(0, 0, half, 0, Math.PI * 2);
              ctx.fill();
              break;
            case 'ring':
              ctx.beginPath();
              ctx.arc(0, 0, half * 0.8, 0, Math.PI * 2);
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(0, 0, half * 0.25, 0, Math.PI * 2);
              ctx.fill();
              break;
            case 'diamond':
              ctx.beginPath();
              ctx.moveTo(0, -half);
              ctx.lineTo(half, 0);
              ctx.lineTo(0, half);
              ctx.lineTo(-half, 0);
              ctx.closePath();
              ctx.fill();
              break;
            case 'triangle':
              ctx.beginPath();
              ctx.moveTo(0, -half);
              ctx.lineTo(half * 0.9, half * 0.7);
              ctx.lineTo(-half * 0.9, half * 0.7);
              ctx.closePath();
              ctx.fill();
              break;
            case 'cross':
              ctx.fillRect(-half * 0.2, -half, half * 0.3, this.size);
              ctx.fillRect(-half, -half * 0.2, this.size, half * 0.3);
              break;
            case 'star':
              drawStar(ctx, 0, 0, 5, half, half * 0.4);
              ctx.fill();
              break;
          }

          ctx.restore();
        }
      }

      // 75 objek — lebih ramai!
      for (let i = 0; i < 75; i++) {
        objects.push(new MotionObject());
      }

      function animateObjects() {
        ctx.clearRect(0, 0, width, height);
        for (let obj of objects) {
          obj.update();
          obj.draw();
        }
        // Garis penghubung lebih banyak
        for (let i = 0; i < objects.length; i++) {
          for (let j = i + 1; j < objects.length; j++) {
            const dx = objects[i].x - objects[j].x;
            const dy = objects[i].y - objects[j].y;
            const dist = Math.hypot(dx, dy);
            const maxDist = 160;
            if (dist < maxDist) {
              const alpha = 0.04 * (1 - dist / maxDist);
              ctx.beginPath();
              ctx.moveTo(objects[i].x, objects[i].y);
              ctx.lineTo(objects[j].x, objects[j].y);
              ctx.strokeStyle = `rgba(180, 210, 255, ${alpha})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animateObjects);
      }
      animateObjects();

      // ============================================================
      // 2. ANGKA DINAMIS
      // ============================================================
      function updateNumbers() {
        const peopleEl = document.getElementById('peopleCount');
        const eventEl = document.getElementById('eventCount');
        if (peopleEl) {
          let base = 2400;
          let variasi = Math.floor(Math.random() * 500) - 200;
          let val = base + variasi;
          if (val < 1800) val = 1800;
          if (val > 3100) val = 3100;
          peopleEl.textContent = (val / 1000).toFixed(1) + 'K';
        }
        if (eventEl) {
          let base = 18;
          let shift = Math.floor(Math.random() * 8) - 3;
          let val = base + shift;
          if (val < 10) val = 10;
          if (val > 28) val = 28;
          eventEl.textContent = val;
        }
      }
      setInterval(updateNumbers, 4000);
      updateNumbers();

      // ============================================================
      // 3. TOMBOL JELAJAHI
      // ============================================================
      const exploreBtn = document.getElementById('exploreBtn');
      if (exploreBtn) {
        exploreBtn.addEventListener('click', function(e) {
          e.preventDefault();
          this.style.transform = 'scale(0.93)';
          setTimeout(() => { this.style.transform = ''; }, 150);
          window.open('https://mahesaapii26-glitch.github.io/hesa/', '_blank');
        });
      }

      // ============================================================
      // 4. TOMBOL KIRIM SURAT → Inbox

      const devBtn = document.getElementById('devBtn');
      if (devBtn) {
        devBtn.addEventListener('click', function(e) {
          e.preventDefault();
          this.style.transform = 'scale(0.93)';

        resizeCanvas();
        for (let obj of objects) {

          if (obj.y > height) obj.y = height * 0.5;
        }
      });
